name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "src/**", "README.md", "CONTRIBUTING.md", "pyproject.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "src/**", "CONTRIBUTING.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # mkdocstrings reads src/ statically, so only the docs group is needed.
      - run: uv sync --only-group docs
      - run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
