[project]
name = "doctopus"
version = "0.1.0"
description = "Many arms. One API. Open document-processing gateway with intelligent backend routing."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "mcp>=2",
  "xberg",
]

[project.optional-dependencies]
docling = ["docling>=2.143", "rapidocr", "onnxruntime"]
dev = ["pypdfium2", "pytest>=8", "httpx>=0.27", "fpdf2>=2.8", "python-docx>=1.1"]

[project.scripts]
doctopus = "doctopus.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctopus"]
