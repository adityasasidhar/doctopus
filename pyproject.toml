[project]
name = "doctopus-ai"
dynamic = ["version"]
description = "Many arms. One API. Open document-processing gateway with intelligent backend routing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Sasidhar" }]
requires-python = ">=3.12,<3.13"
keywords = ["document-parsing", "pdf", "ocr", "markdown", "llm", "rag", "mcp", "docling", "document-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "mcp>=2",
  "xberg",
]

[project.optional-dependencies]
docling = ["docling>=2.143", "rapidocr", "onnxruntime"]
paddleocr = ["paddleocr[doc-parser]>=3.4,<4", "paddlepaddle>=3.2,<4"]
markitdown = ["markitdown[docx,pptx,xlsx,xls,pdf]>=0.1.9"]
pymupdf4llm = ["pymupdf>=2.0"]  # AGPL-3.0; includes the former pymupdf4llm -- optional, never in Lite
ollama = ["ollama>=0.6", "pypdfium2"]
# marker / mineru run as sidecar CLIs in their own uv tool envs (their pins conflict: pillow<11 vs >=11)
dev = ["pypdfium2", "pytest>=8", "httpx>=0.27", "fpdf2>=2.8", "python-docx>=1.1"]

[project.urls]
Homepage = "https://github.com/adityasasidhar/doctopus"
Documentation = "https://adityasasidhar.github.io/doctopus/"
Repository = "https://github.com/adityasasidhar/doctopus"
Issues = "https://github.com/adityasasidhar/doctopus/issues"

[project.scripts]
doctopus = "doctopus.interfaces.cli:app"

[dependency-groups]
docs = ["mkdocs-material>=9.6,<10", "mkdocstrings[python]>=0.29", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/doctopus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/doctopus"]

[tool.hatch.build.targets.sdist]
include = ["src/doctopus", "tests", "README.md", "LICENSE", "CONTRIBUTING.md"]
