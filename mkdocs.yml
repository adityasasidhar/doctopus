site_name: Doctopus
site_description: Many arms. One API. Open document-processing gateway with intelligent backend routing.
site_url: https://adityasasidhar.github.io/doctopus/
repo_name: adityasasidhar/doctopus
repo_url: https://github.com/adityasasidhar/doctopus
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Aditya Sasidhar · MIT License

# Internal design specs and plans live next to the site sources but are not published.
exclude_docs: |
  superpowers/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adityasasidhar/doctopus
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/doctopus-ai/

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - Usage:
      - Command line: usage/cli.md
      - Python: usage/python.md
      - REST API & demo UI: usage/rest-api.md
      - MCP server: usage/mcp.md
  - Concepts:
      - Engines: concepts/engines.md
      - Routing & fallback: concepts/routing.md
      - Output schema: concepts/output.md
      - Chunking: concepts/chunking.md
  - Deployment: deployment.md
  - Benchmarks: benchmarks.md
  - Reference:
      - Python API: reference/python-api.md
      - Configuration: reference/configuration.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
